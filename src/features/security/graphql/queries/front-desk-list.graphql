query FrontDeskList($filters: UserFilterInput, $pagination: PaginationInput, $sort: [SortInput!]) {
  frontDeskList(filters: $filters, pagination: $pagination, sort: $sort) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
      pageSize
      page
      totalPagesCount
    }
    rows {
      id
      status
      fullName
      email
      countryCode
      formattedPhoneNumber
    }
  }
}
