query Events($status: EventStatus) {
  events(status: $status) {
    id
    name
    brideName
    groomName
    customerName
    createdBy
    date
    startTime
    endTime
    venueName
    expectedGuests
    hallCapacity
    hallReference
    address
    googleMapsUrl
    invitationCount
    status
    language
    createdAt
  }
}
