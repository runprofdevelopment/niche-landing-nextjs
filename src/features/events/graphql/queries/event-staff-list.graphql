query EventStaffList(
  $eventId: ID!
  $pagination: PaginationInput
  $sort: [SortInput!]
  $filters: EventStaffFilterInput
) {
  eventStaffList(eventId: $eventId, pagination: $pagination, sort: $sort, filters: $filters) {
    pageInfo {
      hasNextPage
      hasPreviousPage
      totalCount
      pageSize
      page
      totalPagesCount
    }
    rows {
      role
      phoneNumber
      formattedPhoneNumber
      eventId
      email
      createdAt
      countryCode
      id
      fullName
      note
      updatedAt
    }
  }
}
