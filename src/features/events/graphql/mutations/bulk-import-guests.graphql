mutation BulkImportGuests($input: BulkImportGuestsInput!) {
  bulkImportGuests(input: $input) {
    message
    importedCount
    guests {
      id
      eventId
      name
      familyName
      email
      phone
      gender
      abayaLabel
      code
      rsvpStatus
      groupId
      seatId
      tableId
      checkedInAt
      checkedOutAt
    }
    errors {
      row
      field
      message
    }
  }
}
