mutation CreateEvent($input: CreateEventInput!) {
  createEvent(input: $input) {
    id
    name
    brideName
    groomName
    customerName
    createdBy
    date
    startTime
    endTime
    venueName
    expectedGuests
    hallCapacity
    hallReference
    address
    googleMapsUrl
    invitationCount
    status
    language
    createdAt
  }
}
